name: Build and Release APK

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  build:
    name: Build & Release APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'
          cache: 'gradle'

      - name: Grant Execute Permission to Gradlew
        run: chmod +x gradlew

      - name: Build Debug APK
        run: ./gradlew assembleDebug --stacktrace
        env:
          DEFAULT_MIMO_API_KEY: ${{ secrets.DEFAULT_MIMO_API_KEY }}
          DEFAULT_CPA_BASE_URL: ${{ secrets.DEFAULT_CPA_BASE_URL }}
          DEFAULT_CPA_API_KEY: ${{ secrets.DEFAULT_CPA_API_KEY }}
          DEFAULT_CPA_MODEL: ${{ secrets.DEFAULT_CPA_MODEL }}

      - name: Prepare Release Asset
        run: |
          mkdir -p release_assets
          TAG_NAME=${GITHUB_REF#refs/tags/}
          cp app/build/outputs/apk/debug/app-debug.apk "release_assets/DreamTales-${TAG_NAME}.apk"

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: release_assets/*.apk
          generate_release_notes: true
          draft: false
          prerelease: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
